name: AI Security Scan

on:
  schedule:
    - cron: '0 2 * * 1'         # 매주 월요일 2:00 UTC
  workflow_dispatch:             # 수동 트리거

jobs:
  security-scan:
    runs-on: ubuntu-latest
    environment: staging         # 프로덕션 환경에 대한 오실행 방지
    steps:
      - uses: actions/checkout@v4

      - name: Run Security Scan
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          TEST_TOKEN: ${{ secrets.TEST_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npx @anthropic/claude-code \
            --non-interactive \
            --command "/security-scan staging"

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-coverage
          path: coverage-report.yml

      - name: Create Issue on High+ Finding
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            if (!fs.existsSync('security-report.md')) return
            const report = fs.readFileSync('security-report.md', 'utf8')
            // 보고서 선두 2000자 만 (원본 페이로드는 포함하지 않음)
            const summary = report.slice(0, 2000)
            github.rest.issues.create({
              ...context.repo,
              title: '보안 진단: 대응 필요한 취약성 검출',
              body: summary,
              labels: ['security', 'high-priority']
            })
